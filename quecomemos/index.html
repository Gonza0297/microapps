<style>
:root{--hero:#1f3a14;--hero-ink:#fff;--accent:#8ad13f;--accent-ink:#13250b;--soft:#eef8e2}
@media (prefers-color-scheme:dark){:root{--soft:#1d2a14}}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;background:var(--bg);min-width:0}
.day h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day.today{border:2px solid var(--accent)}
.slot{display:grid;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.slot select{font-size:15px;color:var(--ink)}
.aisles{columns:2 260px;column-gap:24px}
.aisle{break-inside:avoid;margin-bottom:16px}
.aisle h4{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.it{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.it input{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
.it .q{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.it.done span:not(.q){text-decoration:line-through;color:var(--muted)}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.daychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daychips button{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:42px;white-space:nowrap;cursor:pointer}
.daychips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meal{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);display:grid;gap:6px}
.meal .mt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meal b{font-family:var(--display);font-size:20px}
.meal ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.meal li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.meal li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
</style>
</head>

applyI18n(D);
const FREE=Object.keys(R).filter(k=>!R[k][2]),PRO_R=Object.keys(R).filter(k=>R[k][2]);
const usable=k=>R[k]&&(!R[k][2]||window.PRO);
var plan=null,checked={};
try{plan=JSON.parse(localStorage.getItem('qc-plan')||'null');checked=JSON.parse(localStorage.getItem('qc-check')||'{}')}catch(e){}
if(!Array.isArray(plan)||plan.length!==14)plan=['bolo','pumpkin','chick','tortilla','lentils','caesar','salmon','toast','chickpeas','pizza','tacos','','wok',''];
plan=plan.map(k=>usable(k)?k:'');
try{const p=localStorage.getItem('qc-ppl');if(p)document.getElementById('ppl').value=p}catch(e){}
function save(){try{localStorage.setItem('qc-plan',JSON.stringify(plan));localStorage.setItem('qc-check',JSON.stringify(checked));localStorage.setItem('qc-ppl',document.getElementById('ppl').value)}catch(e){}}
const rn=k=>T(R[k][0]);
const opts=sel=>`<option value="">${t('none')}</option><optgroup label="${t('recipes')}">`+FREE.map(k=>`<option value="${k}"${k===sel?' selected':''}>${esc(rn(k))}</option>`).join('')+`</optgroup><optgroup label="${window.PRO?t('proRecipes'):t('proLocked')}">`+PRO_R.map(k=>`<option value="${k}"${k===sel?' selected':''}${window.PRO?'':' disabled'}>${esc(rn(k))}</option>`).join('')+'</optgroup>';
function renderWeek(){
  const today=(new Date().getDay()+6)%7;
  document.getElementById('week').innerHTML=DAYS.map((d,i)=>`<div class="day${i===today?' today':''}"><h3>${T(d)}</h3>
   <label class="slot">${t('lunch')}<select id="s${i*2}" data-k="${i*2}">${opts(plan[i*2])}</select></label>
   <label class="slot">${t('dinner')}<select id="s${i*2+1}" data-k="${i*2+1}">${opts(plan[i*2+1])}</select></label></div>`).join('');
  document.querySelectorAll('#week select').forEach(s=>s.onchange=()=>{plan[s.dataset.k]=s.value;save();renderList()});
}
function fmtQ(q,u){
  if(u==='g'){return q>=1000?fmtNum(q/1000,2)+' kg':Math.ceil(q/10)*10+' g'}
  if(u==='ml'){return q>=1000?fmtNum(q/1000,2)+' l':Math.ceil(q/10)*10+' ml'}
  const n=Math.ceil(q*2)/2;return fmtNum(n,1)+(u==='ud'?'':' '+T(UNIT[u]));
}
function agg(){const ppl=+document.getElementById('ppl').value,a={};
  plan.filter(Boolean).forEach(r=>R[r][1].forEach(([id,q,u])=>{const k=id+'|'+u;a[k]=a[k]||{id,u,q:0};a[k].q+=q*ppl}));return a}
const iname=id=>ING[id][1+LI]||ING[id][1];
var renderList=function(){
  const a=agg(),by={};Object.entries(a).forEach(([k,x])=>(by[ING[x.id][0]]=by[ING[x.id][0]]||[]).push([k,x]));
  const total=Object.keys(a).length,done=Object.keys(a).filter(k=>checked[k]).length;
  document.getElementById('count').textContent=total?t('count',{d:done,t:total}):'';
  document.getElementById('progbar').style.width=(total?done/total*100:0)+'%';
  document.getElementById('aisles').innerHTML=total?AORD.filter(s=>by[s]).map(s=>`<div class="aisle"><h4>${T(AISLE[s])}</h4>${by[s].sort((x,y)=>iname(x[1].id).localeCompare(iname(y[1].id))).map(([k,x])=>`<label class="it${checked[k]?' done':''}"><input type="checkbox" data-k="${k}"${checked[k]?' checked':''}><span>${esc(iname(x.id))}</span><span class="q">${fmtQ(x.q,x.u)}</span></label>`).join('')}</div>`).join(''):`<p class="muted">${t('empty')}</p>`;
  document.querySelectorAll('#aisles input').forEach(c=>c.onchange=()=>{checked[c.dataset.k]=c.checked;save();renderList()});
}
document.getElementById('ppl').onchange=()=>{save();renderList()};
document.getElementById('rand').onclick=()=>{const pool=Object.keys(R).filter(usable).sort(()=>Math.random()-.5);plan=plan.map((_,i)=>pool[i%pool.length]);checked={};save();renderWeek();renderList()};
document.getElementById('clear').onclick=()=>{plan=Array(14).fill('');checked={};save();renderWeek();renderList()};
document.getElementById('copy').onclick=async e=>{const b=e.currentTarget,a=agg(),by={};Object.values(a).forEach(x=>(by[ING[x.id][0]]=by[ING[x.id][0]]||[]).push(x));
  const txt='🛒 '+t('listH')+'\n'+AORD.filter(s=>by[s]).map(s=>'\n'+T(AISLE[s])+'\n'+by[s].map(x=>'- '+iname(x.id)+' ('+fmtQ(x.q,x.u)+')').join('\n')).join('\n');
  try{await navigator.clipboard.writeText(txt);b.textContent=t('copied')}catch(err){b.textContent=t('copyFail')}setTimeout(()=>b.textContent=t('copy'),2000)};
document.getElementById('pro').innerHTML=window.PRO?'':proBanner(t('pro'));
document.getElementById('uses').innerHTML=USES.map(u=>`<div class="use"><b>${T(u[0])}</b><span>${T(u[1])}</span></div>`).join('');
renderAmazon('amz',D.amzH,AMZ);

let selDay=(new Date().getDay()+6)%7;
function renderToday(){
  const today=(new Date().getDay()+6)%7,ppl=+document.getElementById('ppl').value;
  document.getElementById('daychips').innerHTML=DAYS.map((d,i)=>`<button data-d="${i}" aria-pressed="${i===selDay}">${i===today?t('today'):T(d).slice(0,3)+'.'}</button>`).join('');
  document.querySelectorAll('#daychips button').forEach(b=>b.onclick=()=>{selDay=+b.dataset.d;renderToday()});
  const meals=[[t('lunch'),plan[selDay*2]],[t('dinner'),plan[selDay*2+1]]];
  document.getElementById('todayBody').innerHTML=`<p class="muted" style="margin:0">${T(DAYS[selDay])} · ${ppl===1?t('forOne'):t('forN',{n:ppl})}</p>`+meals.map(([lbl,k])=>`<div class="meal"><span class="mt">${lbl}</span>${k&&R[k]?`<b>${esc(rn(k))}</b><ul>${R[k][1].map(([id,q,u])=>`<li><span>${esc(iname(id))}</span><span>${fmtQ(q*ppl,u)}</span></li>`).join('')}</ul>`:`<span class="muted">${t('nothing')}</span>`}</div>`).join('');
}
const _rl=renderList;renderList=function(){_rl();renderToday()};

 ()=>{plan=Array(14).fill('');checked={};save();renderWeek();renderList()});
