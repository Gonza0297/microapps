.ap{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--bg)}

.price{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;font-weight:600}

applyI18n(D);
const priceEl=document.getElementById('price');
var items=null;
try{items=JSON.parse(localStorage.getItem('watios')||'null')}catch(e){}
if(!Array.isArray(items)) items=['fridge','washer','dryer','tv','heater','router'].map(id=>({id,w:APN[id][1],h:APN[id][2],d:APN[id][3]}));
try{priceEl.value=localStorage.getItem('watios-price')||'0.35'}catch(e){priceEl.value='0.35'}
const nameOf=it=>it.n||(it.id&&APN[it.id]?T(APN[it.id][4]):T(D.myAp));
const price=()=>parseFloat(String(priceEl.value).replace(',','.'))||0;
const monthly=it=>(it.w/1000)*it.h*it.d*(52/12);
function save(){try{localStorage.setItem('watios',JSON.stringify(items));localStorage.setItem('watios-price',priceEl.value)}catch(e){}}

const sel=document.getElementById('preset');
sel.innerHTML=AP.map(a=>`<option value="${a[0]}">${esc(T(a[4]))} · ${a[1]} W</option>`).join('')+`<option value="custom">${t('other')}</option>`;

function render(){
  const box=document.getElementById('list');
  const costs=items.map(it=>monthly(it)*price());
  const max=Math.max(...costs,0.01),topI=costs.indexOf(Math.max(...costs));
  box.innerHTML=items.map((it,i)=>`<div class="ap${i===topI&&costs[i]>0?' top1':''}">
    <div class="ap-h"><input id="n${i}" class="nm" value="${esc(nameOf(it))}" aria-label="${esc(nameOf(it))}"><button class="x" data-del="${i}" aria-label="${t('remove')}">×</button></div>
    <div class="grid3 keep">
      <label class="f">${t('fW')}<input id="w${i}" data-k="w" data-i="${i}" type="number" min="0" inputmode="decimal" value="${it.w}"></label>
      <label class="f">${t('fH')}<input id="h${i}" data-k="h" data-i="${i}" type="number" min="0" max="24" step="0.1" inputmode="decimal" value="${it.h}"></label>
      <label class="f">${t('fD')}<input id="d${i}" data-k="d" data-i="${i}" type="number" min="0" max="7" inputmode="numeric" value="${it.d}"></label>
    </div>
    <div class="row">${i===topI&&costs[i]>0?`<span class="badge">${t('most')}</span>`:''}<div class="bar"><i style="width:${(costs[i]/max*100).toFixed(1)}%"></i></div><span class="cost">${fmtEUR(costs[i])}${t('perMonth')}</span></div>
  </div>`).join('');
  box.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{items[e.dataset.i][e.dataset.k]=parseFloat(e.value)||0;save();render()});
  box.querySelectorAll('.nm').forEach((e,i)=>e.oninput=()=>{items[i].n=e.value;save();summary()});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);save();render()});
  summary();
}
function summary(){
  const p=price(),kwh=items.reduce((s,it)=>s+monthly(it),0),total=kwh*p;
  document.getElementById('total').textContent=fmtEUR(total);
  document.getElementById('year').textContent=fmtEUR(total*12,0);
  document.getElementById('kwh').textContent=fmtNum(kwh)+' kWh';
  let top=null;items.forEach(it=>{if(!top||monthly(it)>monthly(top))top=it});
  document.getElementById('top').textContent=top?nameOf(top):'—';
  const tip=document.getElementById('tip');
  if(top&&total>0){
    const tp=TIPS[TIPMAP[top.id]||'def'],m=monthly(top)*p;
    tip.innerHTML=`${t('share',{n:esc(nameOf(top)),p:Math.round(m/total*100)})} ${T(tp[1]).replace(/ °C/g,'\u00a0°C')} ${t('canSave',{s:fmtEUR(m*tp[0]*12,0)})}`;tip.hidden=false;
  }else tip.hidden=true;
  calcLed();renderAmz();
}
priceEl.oninput=()=>{save();render()};
document.getElementById('addBtn').onclick=()=>{
  const v=sel.value;items.push(v==='custom'?{n:T(D.myAp),w:100,h:1,d:7}:{id:v,w:APN[v][1],h:APN[v][2],d:APN[v][3]});save();render();
  const last=document.getElementById('list').lastElementChild;if(last)last.scrollIntoView({behavior:'smooth',block:'center'});
};

 </div>

 <small class="muted" id="ledNote"></small>`;
document.getElementById('ledFrom').value=String(LS.from);
['ledN','ledH','ledFrom'].forEach(id=>document.getElementById(id).oninput=()=>{LS.n=+document.getElementById('ledN').value||0;LS.h=+document.getElementById('ledH').value||0;LS.from=+document.getElementById('ledFrom').value;try{localStorage.setItem('chupaluz-led',JSON.stringify(LS))}catch(e){};calcLed()});
function calcLed(){
  if(!document.getElementById('ledSave'))return;
  const p=price(),to=LS.from===50||LS.from===40?5:9,yr=w=>w/1000*LS.h*365*p;
  document.getElementById('ledSave').textContent=fmtEUR((yr(LS.from)-yr(to))*LS.n,0);
  document.getElementById('ledDet').textContent=t('ledDet',{n:LS.n,a:LS.from,b:to,p:Math.round((1-to/LS.from)*100)});
  const rows=[[t('b_inc'),60,'1.000 h'],[t('b_hal'),50,'2.000 h'],[t('b_cfl'),15,'8.000 h'],['LED',9,'15.000–25.000 h']];
  document.getElementById('ledTab').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} W</td><td>${fmtEUR(yr(r[1]))}</td><td>${r[2]}</td></tr>`).join('');
  document.getElementById('ledNote').textContent=t('ledNote',{h:LS.h});
}

// ----- Amazon -----
function renderAmz(){
  const ids=new Set(items.map(i=>i.id).filter(Boolean)),big=new Set();
  [...items].sort((a,b)=>monthly(b)-monthly(a)).slice(0,3).forEach(i=>i.id&&big.add(TIPMAP[i.id]||i.id));
  const list=AMZ.map(a=>Object.assign({},a,{hot:a.hot||(a.id&&(big.has(a.id)||(a.id==='oldbulb'&&ids.has('oldbulb'))))}));
  renderAmazon('amz',D.amzH,list);
}

const P=s=>String(s).replace(/[  ]/g,' ').replace(/[’]/g,"'");
function makePdf(){
  const msg=document.getElementById('pdfMsg');
  if(!window.jspdf){msg.textContent=t('pdfErr');return}
  const p=price(),rows=items.map(it=>({n:nameOf(it),m:monthly(it)*p,kwh:monthly(it),id:it.id})).sort((a,b)=>b.m-a.m),total=rows.reduce((s,r)=>s+r.m,0);
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),cols=T(D.pdfCol);let y=22;
  d.setFillColor(22,24,31);d.rect(0,0,210,16,'F');d.setTextColor(255,204,31);d.setFontSize(11);d.text(P(t('pdfT')),14,10.5);
  d.setTextColor(22,24,31);d.setFontSize(20);d.text(P(t('pdfH')),14,y+8);y+=18;
  d.setFontSize(10.5);d.setTextColor(95,95,107);d.text(P(T(D.priceLbl)+': '+p.toFixed(2)+'  ·  '+t('pdfDate')+': '+new Date().toLocaleDateString(LOCALE)),14,y);y+=10;
  d.setTextColor(22,24,31);d.setFontSize(13);d.text(P(t('pdfTot',{m:fmtEUR(total),y:fmtEUR(total*12)})),14,y);y+=12;
  d.setFontSize(9);d.setTextColor(95,95,107);d.text(cols[0],14,y);d.text(cols[1],120,y,{align:'right'});d.text(cols[2],152,y,{align:'right'});d.text(cols[3],196,y,{align:'right'});y+=3;
  d.setDrawColor(220,220,215);d.line(14,y,196,y);y+=6;d.setTextColor(22,24,31);d.setFontSize(11);
  rows.forEach(r=>{if(y>270){d.addPage();y=20}d.text(P(r.n).slice(0,46),14,y);d.text(P(fmtNum(r.kwh)),120,y,{align:'right'});d.text(P(fmtEUR(r.m)),152,y,{align:'right'});d.text((total?Math.round(r.m/total*100):0)+'%',196,y,{align:'right'});y+=7});
  y+=6;if(y>235){d.addPage();y=20}
  d.setFontSize(15);d.text(P(t('pdfTop3')),14,y);y+=9;let sv=0;
  rows.slice(0,3).forEach((r,i)=>{const tp=TIPS[TIPMAP[r.id]||'def'],a=r.m*tp[0]*12;sv+=a;if(y>255){d.addPage();y=20}
    d.setFontSize(12);d.setTextColor(170,120,0);d.text(P((i+1)+'. '+r.n+' - '+t('pdfLine',{s:fmtEUR(a,0)})),14,y);y+=6;
    d.setFontSize(10.5);d.setTextColor(22,24,31);const L=d.splitTextToSize(P(T(tp[1])),180);d.text(L,14,y);y+=L.length*5+5});
  if(y>250){d.addPage();y=20}
  d.setFillColor(255,204,31);d.roundedRect(14,y,182,18,3,3,'F');d.setTextColor(22,24,31);d.setFontSize(13);d.text(P(t('pdfAll',{s:fmtEUR(sv,0)})),20,y+11);
  d.setFontSize(8.5);d.setTextColor(95,95,107);d.text(d.splitTextToSize(P(t('pdfDisc')),182),14,286);
  d.save('Chupaluz.pdf');msg.textContent=t('pdfDone');
}
