<style>
:root{--hero:#10204f;--hero-ink:#fff;--accent:#4d7cff;--accent-ink:#fff;--soft:#e8eeff}
@media (prefers-color-scheme:dark){:root{--soft:#1a2340}}
.wrap.cv{max-width:1180px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.wrap.cv{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}.side{position:sticky;top:70px}.side .card{max-height:calc(100vh - 90px);overflow:auto}}
.form{display:grid;gap:18px;min-width:0}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tpl{font:inherit;font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:8px;cursor:pointer;display:grid;gap:6px;justify-items:center}
.mini{display:block;width:56px;height:74px;border-radius:4px;background:#fff;border:1px solid #ddd;position:relative;overflow:hidden}
.m-mod{background:linear-gradient(90deg,#2b4c7e 32%,#fff 32%)}
.m-cre{background:linear-gradient(#5b3fa8 30%,#fff 30%)}.m-cre:after{content:"";position:absolute;left:18px;top:12px;width:20px;height:20px;border-radius:50%;background:#e6ddff;border:2px solid #fff}
.m-eje{background:linear-gradient(#1b1b26 22%,#fff 22%,#fff 100%)}.m-eje:after{content:"";position:absolute;right:0;top:22%;bottom:0;width:30%;background:#eef1f6}
.m-tim{background:#fff}.m-tim:after{content:"";position:absolute;left:12px;top:10px;bottom:8px;width:2px;background:#1f6b52;box-shadow:0 10px 0 2px #1f6b52 inset}
.m-ele{background:#fffdf8}.m-ele:after{content:"";position:absolute;left:10px;right:10px;top:20px;height:1px;background:#a0522d;box-shadow:0 6px 0 #a0522d}
.m-cla{background:#fff}.m-cla:after{content:"";position:absolute;left:8px;right:8px;top:16px;height:2px;background:#2b4c7e}
.m-min{background:#fff}.m-min:after{content:"";position:absolute;left:8px;top:10px;width:28px;height:5px;background:#222}
.photo-row{display:flex;gap:14px;align-items:center}
.ph{width:84px;height:84px;border-radius:50%;background:var(--bg);border:2px dashed var(--line);display:grid;place-items:center;font-size:34px;overflow:hidden;flex:none;background-size:cover;background-position:center}
.tpl[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);outline:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink)}
.entry{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.entry-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--muted);font-size:13px}
.stage{overflow:hidden;border-radius:8px;box-shadow:0 10px 30px rgb(0 0 0 / .18);background:#fff}
.scaler{transform-origin:top left;width:794px}
/* hoja A4 (colores fijos: es papel) */
.page{width:794px;min-height:1123px;background:#fff;color:#22222c;font-family:"Figtree","Inter",sans-serif;font-size:12.5px;line-height:1.5;--c:#2b4c7e}
.page h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 8px;font-weight:800}
.page .sec{margin-bottom:20px}
.page .job{margin-bottom:12px}
.page .job .t{font-weight:700;font-size:13.5px}
.page .job .m{color:#6a6a78;font-size:12px}
.page .job p{margin:4px 0 0;white-space:pre-line}
.page .tags{display:flex;flex-wrap:wrap;gap:6px}
.page .tags span{border:1px solid #d8d8e2;border-radius:4px;padding:2px 8px;font-size:12px}
.page .name{font-family:"DM Serif Display",Georgia,serif;font-size:40px;line-height:1.05;margin:0;font-weight:400}
.page .role{font-size:15px;color:var(--c);font-weight:700;margin:4px 0 0}
.page .contact{display:flex;flex-wrap:wrap;gap:4px 16px;color:#55556a;font-size:12px;margin-top:10px}
.t-clasica{padding:56px 64px}
.t-clasica header{border-bottom:2px solid var(--c);padding-bottom:16px;margin-bottom:22px}
.t-moderna{display:grid;grid-template-columns:250px 1fr}
.t-moderna .col1{background:var(--c);color:#fff;padding:48px 26px}
.t-moderna .col1 h2{color:#fff;opacity:.85}
.t-moderna .col1 .tags span{border-color:rgb(255 255 255 / .4)}
.t-moderna .col1 .contact{color:#fff;flex-direction:column;margin:0}
.t-moderna .col1 .name{font-size:32px;color:#fff}
.t-moderna .col1 .role{color:#fff;opacity:.9;margin-bottom:24px}
.t-moderna .col2{padding:48px 36px}
.t-minimal{padding:64px 72px}
.t-minimal .name{font-family:"Figtree","Inter",sans-serif;font-weight:800;font-size:34px;letter-spacing:-.02em}
.t-minimal .grid{display:grid;grid-template-columns:130px 1fr;gap:0 24px}
.t-minimal header{margin-bottom:32px}
.page .photo{width:120px;height:120px;border-radius:50%;object-fit:cover;display:block}
.t-moderna .col1 .photo{width:150px;height:150px;margin:0 auto 22px;border:4px solid rgb(255 255 255 / .5)}
.t-clasica header,.t-minimal header{display:flex;gap:22px;align-items:center}.t-clasica header .photo,.t-minimal header .photo{width:105px;height:105px}
.t-creativa .band{background:var(--c);color:#fff;padding:44px 60px 70px;position:relative}
.t-creativa .band .name{color:#fff;font-size:44px}.t-creativa .band .role{color:#fff;opacity:.9}
.t-creativa .band .photo{position:absolute;right:60px;bottom:-60px;width:150px;height:150px;border:6px solid #fff}
.t-creativa .cbar{display:flex;flex-wrap:wrap;gap:6px 18px;padding:18px 60px;color:#55556a;font-size:12px;border-bottom:1px solid #eee;padding-right:240px}
.t-creativa .cbody{display:grid;grid-template-columns:1fr 220px;gap:36px;padding:30px 60px}
.t-creativa .tags span{background:color-mix(in srgb,var(--c) 12%,#fff);border:none;color:#22222c}
.t-ejecutiva .top{background:#1b1b26;color:#fff;padding:42px 56px;display:flex;gap:26px;align-items:center}
.t-ejecutiva .top .name{color:#fff}.t-ejecutiva .top .role{color:var(--c);filter:brightness(1.6)}
.t-ejecutiva .top .contact{color:#c9c9d6}
.t-ejecutiva .top .photo{width:120px;height:120px;border-radius:12px}
.t-ejecutiva .ebody{display:grid;grid-template-columns:1fr 230px}
.t-ejecutiva .emain{padding:36px 40px 36px 56px}.t-ejecutiva .eside{background:#f2f4f8;padding:36px 28px;min-height:900px}
.t-ejecutiva h2{border-bottom:2px solid var(--c);padding-bottom:6px}
.t-timeline{padding:52px 60px}
.t-timeline header{display:flex;gap:24px;align-items:center;margin-bottom:28px}
.t-timeline .tl{border-left:3px solid var(--c);margin-left:8px;padding-left:24px}
.t-timeline .tl .job{position:relative}
.t-timeline .tl .job:before{content:"";position:absolute;left:-33px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--c)}
.t-timeline .two{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:10px}
.t-elegante{padding:60px 70px;background:#fffdf8;text-align:left}
.t-elegante header{text-align:center;display:grid;justify-items:center;gap:6px;border-bottom:1px solid var(--c);padding-bottom:22px;margin-bottom:26px}
.t-elegante .name{font-size:46px;letter-spacing:.02em}
.t-elegante .role{font-style:italic;font-weight:400;font-family:"DM Serif Display",serif;font-size:18px}
.t-elegante .contact{justify-content:center}
.t-elegante h2{text-align:center;letter-spacing:.3em;font-weight:600}
.t-elegante .photo{width:110px;height:110px;margin-bottom:8px}
</style>
</head>
<body>
<header class="top"><a href="../" data-i18n="back">← Apps Útiles</a><select class="lang"></select></header>
<section class="hero">
  <div class="hero-in">
    <div class="brand">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></div>
      <h1>CV Flash</h1>

    <p class="tagline" data-i18n="tagline">Tu currículum profesional en PDF, en 5 minutos.</p>
    <ol class="steps">
      <li><b>1</b><span data-i18n="s1">Elige un diseño</span></li>
      <li><b>2</b><span data-i18n="s2">Rellena tus datos</span></li>
      <li><b>3</b><span data-i18n="s3">Descarga el PDF</span></li>
    </ol>
  </div>
</section>

<main class="wrap cv">
  <section id="example" style="grid-column:1/-1"></section>
  <div class="form">
    <section class="card">
      <h2><span class="n">1</span><span data-i18n="designH">Diseño</span></h2>
      <div class="tpls" id="tpls">
        <button class="tpl" data-t="moderna"><i class="mini m-mod"></i><span data-i18n="tMod">Moderna</span></button>
        <button class="tpl" data-t="creativa"><i class="mini m-cre"></i><span data-i18n="tCre">Creativa</span></button>
        <button class="tpl" data-t="ejecutiva"><i class="mini m-eje"></i><span data-i18n="tEje">Ejecutiva</span></button>
        <button class="tpl" data-t="timeline"><i class="mini m-tim"></i><span data-i18n="tTim">Cronológica</span></button>
        <button class="tpl" data-t="elegante"><i class="mini m-ele"></i><span data-i18n="tEle">Elegante</span></button>
        <button class="tpl" data-t="clasica"><i class="mini m-cla"></i><span data-i18n="tClas">Clásica</span></button>
        <button class="tpl" data-t="minimal"><i class="mini m-min"></i><span data-i18n="tMin">Minimal</span></button>
      </div>
      <div class="colors" id="colors"></div>
    </section>
    <section class="card">
      <h2><span class="n">2</span><span data-i18n="dataH">Tus datos</span></h2>
      <div class="photo-row">
        <div class="ph" id="phPrev" aria-hidden="true">👤</div>
        <div style="display:grid;gap:6px">
          <label class="btn small ghost" for="photoIn" data-i18n="addPhoto">📷 Subir foto</label>
          <input id="photoIn" type="file" accept="image/*" hidden>
          <button class="btn small ghost" id="photoDel" type="button" hidden data-i18n="delPhoto">Quitar foto</button>
          <small class="muted" data-i18n="photoHelp">Opcional. Se queda en tu móvil.</small>
        </div>
      </div>
      <div class="grid2"><label class="f"><span data-i18n="fName">Nombre completo</span><input id="f-name" autocomplete="name"></label><label class="f"><span data-i18n="fRole">Puesto</span><input id="f-role"></label></div>
      <div class="grid2"><label class="f"><span data-i18n="fEmail">Email</span><input id="f-email" type="email" autocomplete="email"></label><label class="f"><span data-i18n="fPhone">Teléfono</span><input id="f-phone" type="tel" autocomplete="tel"></label></div>
      <div class="grid2"><label class="f"><span data-i18n="fCity">Ciudad</span><input id="f-city"></label><label class="f"><span data-i18n="fWeb">LinkedIn / web</span><input id="f-web"></label></div>
      <label class="f"><span data-i18n="fAbout">Sobre mí</span><textarea id="f-about"></textarea></label>
    </section>
    <section class="card"><h2><span class="n">3</span><span data-i18n="expH">Experiencia</span></h2><div id="exp" style="display:grid;gap:10px"></div></section>
    <section class="card"><h2><span class="n">4</span><span data-i18n="eduH">Formación</span></h2><div id="edu" style="display:grid;gap:10px"></div></section>
    <section class="card"><h2><span class="n">5</span><span data-i18n="skillH">Habilidades e idiomas</span></h2>
      <label class="f"><span data-i18n="fSkills">Habilidades (separadas por comas)</span><input id="f-skills"></label>
      <label class="f"><span data-i18n="fLangs">Idiomas (separados por comas)</span><input id="f-langs"></label>
    </section>
  </div>
  <div class="side">
    <section class="card">
      <h2 data-i18n="previewH">Vista previa</h2>
      <div class="stage" id="stage"><div class="scaler" id="scaler"><div class="page" id="page"></div></div></div>
      <div class="grid2"><button class="btn" id="dl" data-i18n="dl">📄 PDF</button><button class="btn ghost" id="dlImg" data-i18n="dlImg">🖼 Imagen</button></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div id="pro"></div>
    </section>
  </div>
  <section class="card" style="grid-column:1/-1"><h2 data-i18n="usesH">¿Para qué te sirve?</h2><div class="uses" id="uses"></div></section>
  <section class="card" id="amz" style="grid-column:1/-1"></section>
</main>
<footer data-auto></footer>

function entries(key,lt,lc){
  const box=document.getElementById(key);

   <label class="f">${t('dates')}<input id="${key}d${i}" data-k="d" data-i="${i}" value="${esc(e.d)}"></label>
   <label class="f">${t('desc')}<textarea id="${key}x${i}" data-k="x" data-i="${i}">${esc(e.x)}</textarea></label></div>`).join('')+`<button class="btn small ghost" data-add="1" style="justify-self:start">${t('addE')}</button>`;
  box.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{S[key][el.dataset.i][el.dataset.k]=el.value;save();draw()});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S[key].splice(+b.dataset.del,1);save();entries(key,lt,lc);draw()});

function fit(){const st=document.getElementById('stage'),sc=document.getElementById('scaler'),pg=document.getElementById('page');const s=Math.min(1,st.clientWidth/794);sc.style.transform=`scale(${s})`;st.style.height=(pg.offsetHeight*s)+'px'}

async function renderCanvas(){
  const sc=document.getElementById('scaler'),prev=sc.style.transform;sc.style.transform='none';
  try{await document.fonts.ready;return await html2canvas(document.getElementById('page'),{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false})}
  finally{sc.style.transform=prev;fit()}
}
function stamp(ctx,w,h){if(PRO)return;ctx.save();ctx.translate(w/2,h*0.5);ctx.rotate(-0.6);ctx.fillStyle='rgba(150,150,165,.28)';ctx.font=`800 ${Math.round(w/14)}px Figtree, sans-serif`;ctx.textAlign='center';ctx.fillText(t('mark'),0,0);ctx.restore();
  ctx.fillStyle='rgba(120,120,130,.9)';ctx.font=`600 ${Math.round(w/60)}px Figtree, sans-serif`;ctx.textAlign='center';ctx.fillText('CV Flash · gonza0297.github.io/microapps',w/2,h-24)}
async function download(kind){
  const msg=document.getElementById('msg'),b1=document.getElementById('dl'),b2=document.getElementById('dlImg');
  if(!window.html2canvas||(kind==='pdf'&&!window.jspdf)){msg.textContent=t('libErr');return}
  b1.disabled=b2.disabled=true;msg.textContent=t('preparing');
  try{
    const c=await renderCanvas();stamp(c.getContext('2d'),c.width,c.height);
    const name='CV '+(S.name||'').trim();
    if(kind==='pdf'){const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'}),w=210,h=c.height*w/c.width,img=c.toDataURL('image/jpeg',.95);
      let y=0;pdf.addImage(img,'JPEG',0,0,w,h);while(h-(y+297)>1){y+=297;pdf.addPage();pdf.addImage(img,'JPEG',0,-y,w,h)}deliverFile(pdf.output('blob'),name+'.pdf',null)}
    else{const url=c.toDataURL('image/png');await new Promise(r=>c.toBlob(bl=>{deliverFile(bl,name+'.png',url);r()},'image/png'))}
    msg.textContent=PRO?t('done'):t('doneMark');
  }catch(e){msg.textContent=t('fail')}finally{b1.disabled=b2.disabled=false}
}
document.getElementById('dl').onclick=()=>download('pdf');

document.getElementById('photoIn').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
