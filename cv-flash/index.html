<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Crea tu currículum en minutos y descárgalo en PDF.">
</head>
<body>
<title>CV Flash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script src="../pro.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: formulario a la izquierda, hoja A4 en vivo a la derecha (apilado en móvil) */
:root{
  --bg:#f1f1f4;--surface:#ffffff;--ink:#1b1b26;--muted:#62627a;--line:#dcdce6;
  --accent:#3a3ad1;--accent-ink:#ffffff;
  --display:"DM Serif Display",Georgia,serif;--body:"Plus Jakarta Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101016;--surface:#191922;--ink:#e8e8f0;--muted:#9c9cb4;--line:#2c2c3a;--accent:#8f8fff;--accent-ink:#101016;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101016;--surface:#191922;--ink:#e8e8f0;--muted:#9c9cb4;--line:#2c2c3a;--accent:#8f8fff;--accent-ink:#101016;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);margin:0;line-height:1.05}
.sub{color:var(--muted);margin:4px 0 0}
.app{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:1fr}}
.form{display:grid;gap:12px;min-width:0}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{font-weight:700;cursor:pointer}
.fields{display:grid;gap:8px;margin-top:10px}
.fields label{font-size:12px;color:var(--muted);display:grid;gap:3px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.entry{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.mini{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;justify-self:start}
.tpls{display:flex;gap:8px;flex-wrap:wrap}
.tpl{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.tpl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.colors{display:flex;gap:8px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink)}
.dl{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:12px 18px;cursor:pointer}
.msg{font-size:13px;color:var(--muted)}
.pro{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.pro .buy{justify-self:start;display:inline-block;margin-top:6px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;border-radius:8px;padding:8px 14px}
.side{position:sticky;top:12px;display:grid;gap:12px;min-width:0}
.stage{overflow:hidden;border-radius:6px;box-shadow:0 8px 30px rgb(0 0 0 / .15)}
.scaler{transform-origin:top left;width:794px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{color:var(--muted);font-size:13px;text-align:center}

/* ---- Hoja del CV (colores fijos: es papel) ---- */
.page{width:794px;min-height:1123px;background:#fff;color:#22222c;font-family:var(--body);font-size:12.5px;line-height:1.5;--c:#2b4c7e}
.page h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 8px;font-weight:700}
.page .sec{margin-bottom:20px}
.page .job{margin-bottom:12px}
.page .job .t{font-weight:700;font-size:13.5px}
.page .job .m{color:#6a6a78;font-size:12px}
.page .job p{margin:4px 0 0;white-space:pre-line}
.page .tags{display:flex;flex-wrap:wrap;gap:6px}
.page .tags span{border:1px solid #d8d8e2;border-radius:4px;padding:2px 8px;font-size:12px}
.page .name{font-family:var(--display);font-size:40px;line-height:1.05;margin:0}
.page .role{font-size:15px;color:var(--c);font-weight:600;margin:4px 0 0}
.page .contact{display:flex;flex-wrap:wrap;gap:4px 16px;color:#55556a;font-size:12px;margin-top:10px}
/* Clásica */
.t-clasica{padding:56px 64px}
.t-clasica header{border-bottom:2px solid var(--c);padding-bottom:16px;margin-bottom:22px}
/* Moderna */
.t-moderna{display:grid;grid-template-columns:250px 1fr}
.t-moderna .col1{background:var(--c);color:#fff;padding:48px 26px}
.t-moderna .col1 h2{color:#fff;opacity:.85}
.t-moderna .col1 .tags span{border-color:rgb(255 255 255 / .4)}
.t-moderna .col1 .contact{color:#fff;flex-direction:column;margin:0}
.t-moderna .col1 .name{font-size:32px;color:#fff}
.t-moderna .col1 .role{color:#fff;opacity:.9;margin-bottom:24px}
.t-moderna .col2{padding:48px 36px}
/* Minimal */
.t-minimal{padding:64px 72px}
.t-minimal .name{font-family:var(--body);font-weight:700;font-size:34px;letter-spacing:-.02em}
.t-minimal .grid{display:grid;grid-template-columns:130px 1fr;gap:0 24px}
.t-minimal .grid h2{padding-top:2px}
.t-minimal header{margin-bottom:32px}
</style>

<div class="wrap">
  <header>
    <h1>CV Flash</h1>
    <p class="sub">Rellena tus datos, elige un diseño y descarga tu currículum en PDF. Los datos de ejemplo están para que veas cómo queda.</p>
  </header>

  <div class="app">
    <div class="form">
      <details open>
        <summary>Diseño</summary>
        <div class="fields">
          <div class="tpls" id="tpls">
            <button class="tpl" data-t="clasica">Clásica</button><button class="tpl" data-t="moderna">Moderna</button><button class="tpl" data-t="minimal">Minimal</button>
          </div>
          <div class="colors" id="colors"></div>
        </div>
      </details>
      <details open>
        <summary>Datos personales</summary>
        <div class="fields">
          <div class="two"><label>Nombre completo<input id="f-name"></label><label>Puesto<input id="f-role"></label></div>
          <div class="two"><label>Email<input id="f-email"></label><label>Teléfono<input id="f-phone"></label></div>
          <div class="two"><label>Ciudad<input id="f-city"></label><label>LinkedIn / web<input id="f-web"></label></div>
          <label>Sobre mí<textarea id="f-about"></textarea></label>
        </div>
      </details>
      <details>
        <summary>Experiencia</summary>
        <div class="fields" id="exp"></div>
      </details>
      <details>
        <summary>Formación</summary>
        <div class="fields" id="edu"></div>
      </details>
      <details>
        <summary>Habilidades e idiomas</summary>
        <div class="fields">
          <label>Habilidades (separadas por comas)<input id="f-skills"></label>
          <label>Idiomas (separados por comas)<input id="f-langs"></label>
        </div>
      </details>
      <button class="dl" id="dl">Descargar PDF</button>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="pro" id="pro"></div>
    </div>

    <div class="side">
      <div class="stage" id="stage"><div class="scaler" id="scaler"><div class="page" id="page"></div></div></div>
    </div>
  </div>

  <footer><a href="../" style="color:inherit">← Más apps gratis</a> · Creado por Gonzalo Leon · Contacto: <a href="mailto:appsutiles8@gmail.com" style="color:inherit">appsutiles8@gmail.com</a></footer>
</div>

<script>
const COLORS=["#2b4c7e","#1f6b52","#7a2e3a","#3b3b48","#a0522d","#5b3fa8"];
const EX={tpl:"moderna",color:"#2b4c7e",name:"Laura Martín",role:"Técnica de marketing digital",email:"laura.martin@ejemplo.com",phone:"+32 470 12 34 56",city:"Bruselas",web:"linkedin.com/in/lauramartin",
 about:"Profesional de marketing con 5 años de experiencia en campañas digitales y redes sociales. Me gusta medir resultados y mejorar cada campaña con datos.",
 exp:[{t:"Responsable de redes sociales",c:"Agencia Nova",d:"2022 – Actualidad",x:"Gestión de 8 cuentas de clientes.\nAumento medio del 40% en interacción en un año."},
      {t:"Asistente de marketing",c:"Tiendas Sol",d:"2019 – 2022",x:"Campañas de email y anuncios en Google y Meta.\nInformes mensuales de resultados."}],
 edu:[{t:"Grado en Publicidad y Relaciones Públicas",c:"Universidad Complutense de Madrid",d:"2015 – 2019",x:""}],
 skills:"Google Ads, Meta Ads, Canva, Google Analytics, SEO, Copywriting",langs:"Español (nativo), Francés (C1), Inglés (B2)"};
let D;
try{D=JSON.parse(localStorage.getItem('cv5')||'null')}catch(e){}
if(!D||!D.exp)D=JSON.parse(JSON.stringify(EX));
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem('cv5',JSON.stringify(D))}catch(e){}}
["name","role","email","phone","city","web","about","skills","langs"].forEach(k=>{const el=document.getElementById('f-'+k);el.value=D[k]||'';el.oninput=()=>{D[k]=el.value;save();draw()}});

function entries(key,labels){
  const box=document.getElementById(key);
  box.innerHTML=D[key].map((e,i)=>`<div class="entry">
    <div class="two"><label>${labels[0]}<input id="${key}t${i}" data-k="t" data-i="${i}" value="${esc(e.t)}"></label><label>${labels[1]}<input id="${key}c${i}" data-k="c" data-i="${i}" value="${esc(e.c)}"></label></div>
    <label>Fechas<input id="${key}d${i}" data-k="d" data-i="${i}" value="${esc(e.d)}"></label>
    <label>Descripción<textarea id="${key}x${i}" data-k="x" data-i="${i}">${esc(e.x)}</textarea></label>
    <button class="mini" data-del="${i}">Quitar</button></div>`).join('')+`<button class="mini" data-add="1">+ Añadir</button>`;
  box.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{D[key][el.dataset.i][el.dataset.k]=el.value;save();draw()});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{D[key].splice(b.dataset.del,1);save();entries(key,labels);draw()});
  box.querySelector('[data-add]').onclick=()=>{D[key].push({t:'',c:'',d:'',x:''});save();entries(key,labels);draw()};
}
entries('exp',['Puesto','Empresa']);entries('edu',['Título','Centro']);

document.querySelectorAll('.tpl').forEach(b=>b.onclick=()=>{D.tpl=b.dataset.t;save();draw()});
document.getElementById('colors').innerHTML=COLORS.map(c=>`<button class="sw" style="background:${c}" data-c="${c}" aria-label="Color ${c}"></button>`).join('');
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{D.color=b.dataset.c;save();draw()});

function list(arr){return arr.filter(e=>e.t||e.c).map(e=>`<div class="job"><div class="t">${esc(e.t)}</div><div class="m">${esc(e.c)}${e.c&&e.d?' · ':''}${esc(e.d)}</div>${e.x?`<p>${esc(e.x)}</p>`:''}</div>`).join('')}
function tags(s){return `<div class="tags">${String(s||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`}
function contact(){return `<div class="contact">${[D.email,D.phone,D.city,D.web].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`}
function sec(t,h,cls=''){return h?`<div class="sec ${cls}"><h2>${t}</h2>${h}</div>`:''}
function draw(){
  document.querySelectorAll('.tpl').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===D.tpl));
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===D.color));
  const p=document.getElementById('page');p.className='page t-'+D.tpl;p.style.setProperty('--c',D.color);
  const about=D.about?`<p style="margin:0">${esc(D.about)}</p>`:'';
  if(D.tpl==='moderna'){
    p.innerHTML=`<div class="col1"><h1 class="name">${esc(D.name)}</h1><p class="role">${esc(D.role)}</p>${sec('Contacto',contact())}${sec('Habilidades',D.skills?tags(D.skills):'')}${sec('Idiomas',D.langs?tags(D.langs):'')}</div>
      <div class="col2">${sec('Perfil',about)}${sec('Experiencia',list(D.exp))}${sec('Formación',list(D.edu))}</div>`;
  }else if(D.tpl==='minimal'){
    const row=(t,h)=>h?`<h2>${t}</h2><div class="sec">${h}</div>`:'';
    p.innerHTML=`<header><h1 class="name">${esc(D.name)}</h1><p class="role">${esc(D.role)}</p>${contact()}</header>
      <div class="grid">${row('Perfil',about)}${row('Experiencia',list(D.exp))}${row('Formación',list(D.edu))}${row('Habilidades',D.skills?tags(D.skills):'')}${row('Idiomas',D.langs?tags(D.langs):'')}</div>`;
  }else{
    p.innerHTML=`<header><h1 class="name">${esc(D.name)}</h1><p class="role">${esc(D.role)}</p>${contact()}</header>
      ${sec('Perfil',about)}${sec('Experiencia',list(D.exp))}${sec('Formación',list(D.edu))}${sec('Habilidades',D.skills?tags(D.skills):'')}${sec('Idiomas',D.langs?tags(D.langs):'')}`;
  }
  fit();
}
function fit(){
  const st=document.getElementById('stage'),sc=document.getElementById('scaler'),pg=document.getElementById('page');
  const s=Math.min(1,st.clientWidth/794);sc.style.transform=`scale(${s})`;st.style.height=(pg.offsetHeight*s)+'px';
}
addEventListener('resize',fit);

// ===== COBRO: Pack Pro compartido (ver ../pro.js) =====
const PRO=!!window.PRO;
const proBox=document.getElementById('pro');
proBox.innerHTML=PRO?'<b>Pack Pro activado.</b> Tus PDF salen sin marca de agua.':window.proBanner('La descarga gratis lleva marca de agua. Con Pro, tu CV sale limpio.');
document.getElementById('dl').onclick=async()=>{
  const msg=document.getElementById('msg'),btn=document.getElementById('dl');
  if(!window.html2canvas||!window.jspdf){msg.textContent='No se pudo cargar el generador de PDF. Recarga la página.';return}
  btn.disabled=true;msg.textContent='Preparando tu PDF…';
  const sc=document.getElementById('scaler'),prev=sc.style.transform;sc.style.transform='none';
  try{
    await document.fonts.ready;
    const canvas=await html2canvas(document.getElementById('page'),{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});
    const w=210,h=canvas.height*w/canvas.width,img=canvas.toDataURL('image/jpeg',0.95);
    const mark=()=>{if(PRO)return;pdf.setTextColor(200,200,210);pdf.setFontSize(46);pdf.text('CV FLASH · versión gratis',105,160,{align:'center',angle:35});pdf.setFontSize(9);pdf.setTextColor(140,140,150);pdf.text('Hecho con CV Flash · gonza0297.github.io/microapps',105,292,{align:'center'})};
    let y=0;pdf.addImage(img,'JPEG',0,0,w,h);mark();
    while(h-(y+297)>1){y+=297;pdf.addPage();pdf.addImage(img,'JPEG',0,-y,w,h);mark()}
    pdf.save('CV '+(D.name||'mi curriculum').trim()+'.pdf');
    msg.textContent=PRO?'PDF descargado.':'PDF descargado (con marca de agua).';
  }catch(e){
    msg.textContent='No se pudo generar el PDF. Inténtalo de nuevo.';
  }finally{sc.style.transform=prev;fit();btn.disabled=false}
};
draw();
</script>

</body>
</html>
