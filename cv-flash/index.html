<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CV Flash</title>
<meta name="description" content="Crea tu currículum en minutos y descárgalo en PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="../ui.css">
<script src="../i18n.js"></script>
<script src="../pro.js"></script>
<script src="../afiliados.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--hero:#10204f;--hero-ink:#fff;--accent:#4d7cff;--accent-ink:#fff;--soft:#e8eeff}
@media (prefers-color-scheme:dark){:root{--soft:#1a2340}}
.wrap.cv{max-width:1180px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.wrap.cv{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}.side{position:sticky;top:70px}.side .card{max-height:calc(100vh - 90px);overflow:auto}}
.form{display:grid;gap:18px;min-width:0}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer;min-height:50px}
.tpl[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);outline:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink)}
.entry{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.entry-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--muted);font-size:13px}
.stage{overflow:hidden;border-radius:8px;box-shadow:0 10px 30px rgb(0 0 0 / .18);background:#fff}
.scaler{transform-origin:top left;width:794px}
/* hoja A4 (colores fijos: es papel) */
.page{width:794px;min-height:1123px;background:#fff;color:#22222c;font-family:"Figtree","Inter",sans-serif;font-size:12.5px;line-height:1.5;--c:#2b4c7e}
.page h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 8px;font-weight:800}
.page .sec{margin-bottom:20px}
.page .job{margin-bottom:12px}
.page .job .t{font-weight:700;font-size:13.5px}
.page .job .m{color:#6a6a78;font-size:12px}
.page .job p{margin:4px 0 0;white-space:pre-line}
.page .tags{display:flex;flex-wrap:wrap;gap:6px}
.page .tags span{border:1px solid #d8d8e2;border-radius:4px;padding:2px 8px;font-size:12px}
.page .name{font-family:"DM Serif Display",Georgia,serif;font-size:40px;line-height:1.05;margin:0;font-weight:400}
.page .role{font-size:15px;color:var(--c);font-weight:700;margin:4px 0 0}
.page .contact{display:flex;flex-wrap:wrap;gap:4px 16px;color:#55556a;font-size:12px;margin-top:10px}
.t-clasica{padding:56px 64px}
.t-clasica header{border-bottom:2px solid var(--c);padding-bottom:16px;margin-bottom:22px}
.t-moderna{display:grid;grid-template-columns:250px 1fr}
.t-moderna .col1{background:var(--c);color:#fff;padding:48px 26px}
.t-moderna .col1 h2{color:#fff;opacity:.85}
.t-moderna .col1 .tags span{border-color:rgb(255 255 255 / .4)}
.t-moderna .col1 .contact{color:#fff;flex-direction:column;margin:0}
.t-moderna .col1 .name{font-size:32px;color:#fff}
.t-moderna .col1 .role{color:#fff;opacity:.9;margin-bottom:24px}
.t-moderna .col2{padding:48px 36px}
.t-minimal{padding:64px 72px}
.t-minimal .name{font-family:"Figtree","Inter",sans-serif;font-weight:800;font-size:34px;letter-spacing:-.02em}
.t-minimal .grid{display:grid;grid-template-columns:130px 1fr;gap:0 24px}
.t-minimal header{margin-bottom:32px}
</style>
</head>
<body>
<header class="top"><a href="../" data-i18n="back">← Apps Útiles</a><select class="lang"></select></header>
<section class="hero">
  <div class="hero-in">
    <div class="brand">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></div>
      <h1>CV Flash</h1>
    </div>
    <p class="tagline" data-i18n="tagline">Tu currículum profesional en PDF, en 5 minutos.</p>
    <ol class="steps">
      <li><b>1</b><span data-i18n="s1">Elige un diseño</span></li>
      <li><b>2</b><span data-i18n="s2">Rellena tus datos</span></li>
      <li><b>3</b><span data-i18n="s3">Descarga el PDF</span></li>
    </ol>
  </div>
</section>

<main class="wrap cv">
  <div class="form">
    <section class="card">
      <h2><span class="n">1</span><span data-i18n="designH">Diseño</span></h2>
      <div class="tpls" id="tpls"><button class="tpl" data-t="clasica" data-i18n="tClas">Clásica</button><button class="tpl" data-t="moderna" data-i18n="tMod">Moderna</button><button class="tpl" data-t="minimal" data-i18n="tMin">Minimal</button></div>
      <div class="colors" id="colors"></div>
    </section>
    <section class="card">
      <h2><span class="n">2</span><span data-i18n="dataH">Tus datos</span></h2>
      <div class="grid2"><label class="f"><span data-i18n="fName">Nombre completo</span><input id="f-name" autocomplete="name"></label><label class="f"><span data-i18n="fRole">Puesto</span><input id="f-role"></label></div>
      <div class="grid2"><label class="f"><span data-i18n="fEmail">Email</span><input id="f-email" type="email" autocomplete="email"></label><label class="f"><span data-i18n="fPhone">Teléfono</span><input id="f-phone" type="tel" autocomplete="tel"></label></div>
      <div class="grid2"><label class="f"><span data-i18n="fCity">Ciudad</span><input id="f-city"></label><label class="f"><span data-i18n="fWeb">LinkedIn / web</span><input id="f-web"></label></div>
      <label class="f"><span data-i18n="fAbout">Sobre mí</span><textarea id="f-about"></textarea></label>
    </section>
    <section class="card"><h2><span class="n">3</span><span data-i18n="expH">Experiencia</span></h2><div id="exp" style="display:grid;gap:10px"></div></section>
    <section class="card"><h2><span class="n">4</span><span data-i18n="eduH">Formación</span></h2><div id="edu" style="display:grid;gap:10px"></div></section>
    <section class="card"><h2><span class="n">5</span><span data-i18n="skillH">Habilidades e idiomas</span></h2>
      <label class="f"><span data-i18n="fSkills">Habilidades (separadas por comas)</span><input id="f-skills"></label>
      <label class="f"><span data-i18n="fLangs">Idiomas (separados por comas)</span><input id="f-langs"></label>
    </section>
  </div>
  <div class="side">
    <section class="card">
      <h2 data-i18n="previewH">Vista previa</h2>
      <div class="stage" id="stage"><div class="scaler" id="scaler"><div class="page" id="page"></div></div></div>
      <button class="btn" id="dl" data-i18n="dl">⬇ Descargar PDF</button>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div id="pro"></div>
    </section>
  </div>
  <section class="card" style="grid-column:1/-1"><h2 data-i18n="usesH">¿Para qué te sirve?</h2><div class="uses" id="uses"></div></section>
  <section class="card" id="amz" style="grid-column:1/-1"></section>
</main>
<footer data-auto></footer>

  document.querySelectorAll('.tpl').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===S.tpl));
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===S.color));
  const p=document.getElementById('page');p.className='page t-'+S.tpl;p.style.setProperty('--c',S.color);
  const about=S.about?`<p style="margin:0">${esc(S.about)}</p>`:'';
  if(S.tpl==='moderna')p.innerHTML=`<div class="col1"><h1 class="name">${esc(S.name)}</h1><p class="role">${esc(S.role)}</p>${sec('cContact',contact())}${sec('cSkills',S.skills?tags(S.skills):'')}${sec('cLangs',S.langs?tags(S.langs):'')}</div><div class="col2">${sec('cProfile',about)}${sec('cExp',list(S.exp))}${sec('cEdu',list(S.edu))}</div>`;
  else if(S.tpl==='minimal'){const row=(k,h)=>h?`<h2>${t(k)}</h2><div class="sec">${h}</div>`:'';p.innerHTML=`<header><h1 class="name">${esc(S.name)}</h1><p class="role">${esc(S.role)}</p>${contact()}</header><div class="grid">${row('cProfile',about)}${row('cExp',list(S.exp))}${row('cEdu',list(S.edu))}${row('cSkills',S.skills?tags(S.skills):'')}${row('cLangs',S.langs?tags(S.langs):'')}</div>`}
  else p.innerHTML=`<header><h1 class="name">${esc(S.name)}</h1><p class="role">${esc(S.role)}</p>${contact()}</header>${sec('cProfile',about)}${sec('cExp',list(S.exp))}${sec('cEdu',list(S.edu))}${sec('cSkills',S.skills?tags(S.skills):'')}${sec('cLangs',S.langs?tags(S.langs):'')}`;
  fit();
}
function fit(){const st=document.getElementById('stage'),sc=document.getElementById('scaler'),pg=document.getElementById('page');const s=Math.min(1,st.clientWidth/794);sc.style.transform=`scale(${s})`;st.style.height=(pg.offsetHeight*s)+'px'}
addEventListener('resize',fit);
const PRO=!!window.PRO;
document.getElementById('pro').innerHTML=PRO?`<p class="msg">${t('proOn')}</p>`:proBanner(t('proTxt'));
document.getElementById('dl').onclick=async()=>{
  const msg=document.getElementById('msg'),btn=document.getElementById('dl');
  if(!window.html2canvas||!window.jspdf){msg.textContent=t('libErr');return}
  btn.disabled=true;msg.textContent=t('preparing');
  const sc=document.getElementById('scaler'),prev=sc.style.transform;sc.style.transform='none';
  try{
    await document.fonts.ready;
    const canvas=await html2canvas(document.getElementById('page'),{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'});
    const w=210,h=canvas.height*w/canvas.width,img=canvas.toDataURL('image/jpeg',.95);
    const mark=()=>{if(PRO)return;pdf.setTextColor(200,200,210);pdf.setFontSize(40);pdf.text(t('mark'),105,160,{align:'center',angle:35});pdf.setFontSize(9);pdf.setTextColor(140,140,150);pdf.text('CV Flash · gonza0297.github.io/microapps',105,292,{align:'center'})};
    let y=0;pdf.addImage(img,'JPEG',0,0,w,h);mark();
    while(h-(y+297)>1){y+=297;pdf.addPage();pdf.addImage(img,'JPEG',0,-y,w,h);mark()}
    pdf.save('CV '+(S.name||'').trim()+'.pdf');msg.textContent=PRO?t('done'):t('doneMark');
  }catch(e){msg.textContent=t('fail')}finally{sc.style.transform=prev;fit();btn.disabled=false}
};
document.getElementById('uses').innerHTML=USES.map(u=>`<div class="use"><b>${T(u[0])}</b><span>${T(u[1])}</span></div>`).join('');
renderAmazon('amz',D.amzH,AMZ);
draw();
</script>
