:root{--hero:#2a1430;--hero-ink:#fff;--accent:#ff5a4e;--accent-ink:#fff;--soft:#ffe9e6}

.years{display:grid;gap:8px}
.years-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.years-top b{font-family:var(--display);font-size:26px}
input[type=range]{accent-color:var(--accent);min-height:30px;padding:0;border:none;background:transparent}
.switch{display:flex;gap:12px;align-items:center;font-weight:600;cursor:pointer}

.hb{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.hb-h{display:flex;gap:8px;align-items:center}
.hb-h input{font-weight:700;flex:1}
.hb-f{display:grid;grid-template-columns:110px 1fr;gap:10px}
.hb-y{font-size:14px;color:var(--muted)}
.hb-y b{color:var(--ink);font-variant-numeric:tabular-nums}
.sharebox{background:var(--soft);border-radius:16px;padding:14px;display:grid;gap:10px}
.sharebox p{margin:0;font-weight:600}

  box.querySelectorAll('.pr').forEach(e=>e.oninput=()=>{habits[e.dataset.i].p=e.value;save();calc()});
  box.querySelectorAll('.fq').forEach(e=>e.onchange=()=>{habits[e.dataset.i].f=e.value;save();calc()});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{habits.splice(+b.dataset.del,1);save();render()});
  calc();
}
function calc(){
  const y=+document.getElementById('yrs').value,inv=document.getElementById('inv').checked;
  document.getElementById('yrsLbl').textContent=ylbl(y);
  document.querySelectorAll('.hb-y').forEach((el,i)=>el.innerHTML=`${t('perYear')}: <b>${fmtEUR(yearly(habits[i]),0)}</b> · ${t('inY',{y:ylbl(y)})}: <b>${fmtEUR(future(yearly(habits[i]),y,inv),0)}</b>`);
  const annual=habits.reduce((s,h)=>s+yearly(h),0),total=future(annual,y,inv);
  document.getElementById('lead').textContent=inv?t('leadInv',{y:ylbl(y)}):t('leadSpent',{y:ylbl(y)});
  document.getElementById('big').textContent=fmtEUR(total,0);
  let eq=null;EQUIV.forEach(e=>{if(total>=e[0])eq=e});
  document.getElementById('equiv').textContent=eq?(total>=eq[0]*2?t('eqTimes',{x:T(eq[1]),n:Math.floor(total/eq[0])}):t('eqIs',{x:T(eq[1])})):t('eqNone');
  document.getElementById('shareText').textContent=t('shareTxt',{a:fmtEUR(annual,0),y:ylbl(y),t:fmtEUR(total,0),e:eq?' ('+T(eq[1])+')':''});
  renderAmz();
}
document.getElementById('chips').innerHTML=IDEAS.map(i=>`<button class="chip" data-id="${i[0]}">+ ${esc(T(i[3]))}</button>`).join('')+`<button class="chip" data-id="">${t('other')}</button>`;
document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{const id=b.dataset.id;habits.push(id?{id,p:IDN[id][1],f:IDN[id][2]}:{n:t('mine'),p:5,f:'semana'});save();render()});
document.getElementById('yrs').oninput=calc;document.getElementById('inv').onchange=calc;
document.getElementById('copy').onclick=async e=>{const b=e.currentTarget,txt=document.getElementById('shareText').textContent+' → gonza0297.github.io/microapps/fuga-de-euros/';
  try{await navigator.clipboard.writeText(txt);b.textContent=t('copied')}catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById('shareText'));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent=t('selected')}
  setTimeout(()=>b.textContent=t('copy'),2000)};
function renderAmz(){const ids=new Set(habits.map(h=>h.id));renderAmazon('amz',D.amzH,AMZ.map(a=>Object.assign({},a,{hot:a.id&&ids.has(a.id)})))}
document.getElementById('uses').innerHTML=USES.map(u=>`<div class="use"><b>${T(u[0])}</b><span>${T(u[1])}</span></div>`).join('');

const PL=document.getElementById('plan');
if(window.PRO){PL.className='card';PL.innerHTML=`<button class="btn" id="planBtn">⬇ ${t('planBtn')}</button><div class="msg" id="planMsg" aria-live="polite"></div>`;document.getElementById('planBtn').onclick=makePlan}
else PL.innerHTML=proBanner(t('planPro'));
const P=s=>String(s).replace(/[  ]/g,' ').replace(/[’]/g,"'");
function makePlan(){
  const msg=document.getElementById('planMsg');if(!window.jspdf){msg.textContent=t('pdfErr');return}
  const rows=habits.map(h=>({n:nameOf(h),p:parseFloat(String(h.p).replace(',','.'))||0,f:h.f,y:yearly(h)})).filter(r=>r.y>0).sort((a,b)=>b.y-a.y),annual=rows.reduce((s,r)=>s+r.y,0);
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),cols=T(D.pdfCol);let y=22;
  d.setFillColor(42,20,48);d.rect(0,0,210,16,'F');d.setTextColor(255,90,78);d.setFontSize(11);d.text(P(t('pdfT')),14,10.5);
  d.setTextColor(23,23,28);d.setFontSize(20);d.text(P(t('pdfH')),14,y+8);y+=18;
  d.setFontSize(13);d.setTextColor(196,61,43);d.text(P(t('pdfNow',{a:fmtEUR(annual,0),m:fmtEUR(annual/12,0)})),14,y);y+=12;
  d.setFontSize(9);d.setTextColor(95,95,107);d.text(P(cols[0]),14,y);d.text(P(cols[1]),110,y,{align:'right'});d.text(P(cols[2]),116,y);d.text(P(cols[3]),196,y,{align:'right'});y+=3;
  d.setDrawColor(220,220,215);d.line(14,y,196,y);y+=6;d.setTextColor(23,23,28);d.setFontSize(11);
  rows.forEach(r=>{if(y>270){d.addPage();y=20}d.text(P(r.n).slice(0,40),14,y);d.text(P(fmtEUR(r.p)),110,y,{align:'right'});d.text(P(T(FREQL[r.f])),116,y);d.text(P(fmtEUR(r.y,0)),196,y,{align:'right'});y+=7});
  y+=6;if(y>220){d.addPage();y=20}
  d.setFontSize(15);d.text(P(t('pdfPlan')),14,y);y+=9;let sv=0;
  rows.slice(0,3).forEach((r,i)=>{const a=r.y/2;sv+=a;d.setFontSize(11.5);d.setTextColor(196,61,43);d.text(P((i+1)+'. '+r.n),14,y);d.setTextColor(23,23,28);d.text(P(t('pdfSave',{a:fmtEUR(a,0)})),196,y,{align:'right'});y+=7});
  y+=6;if(y>220){d.addPage();y=20}
  d.setFontSize(15);d.text(P(t('pdfIf')),14,y);y+=10;
  [5,10,20].forEach(n=>{d.setFillColor(255,233,230);d.roundedRect(14,y-6,182,14,2,2,'F');d.setFontSize(11.5);d.setTextColor(23,23,28);
    d.text(P(t('pdfKept',{y:ylbl(n),a:fmtEUR(sv*n,0)})),18,y+2.5);d.setTextColor(196,61,43);d.text(P(t('pdfInv',{a:fmtEUR(future(sv,n,true),0)})),192,y+2.5,{align:'right'});y+=18});
  d.setFontSize(13);d.setTextColor(23,23,28);d.text(P(t('pdfTricks')),14,y);y+=8;d.setFontSize(10.5);
  [t('pdfT1',{a:fmtEUR(sv/12,0)}),t('pdfT2'),t('pdfT3')].forEach(s=>{const L=d.splitTextToSize(P('•  '+s),180);d.text(L,14,y);y+=L.length*5+3});
  d.setFontSize(8.5);d.setTextColor(95,95,107);d.text(d.splitTextToSize(P(t('pdfDisc')),182),14,284);
  d.save('Fuga-de-Euros.pdf');msg.textContent=t('pdfDone');
}
render();
</script>
