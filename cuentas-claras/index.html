<meta name="description" content="Reparte gastos entre amigos y descubre quién debe a quién.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap">

<style>
:root{--hero:#0b3b3c;--hero-ink:#fff;--accent:#19c2b3;--accent-ink:#06292a;--soft:#dff6f3}
@media (prefers-color-scheme:dark){:root{--soft:#143534}}
.tx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:rgb(255 255 255 / .08);border-radius:14px;padding:12px}
.tx .who{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.tx .who:last-child{text-align:right}
.tx .arrow{display:grid;justify-items:center;font-size:12px;opacity:.9;font-weight:600}
.tx .amt{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.ok{font-size:18px;font-weight:700;margin:0}
.people{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:2px 2px 2px 14px;font-weight:700;min-height:44px}
.pill small{font-variant-numeric:tabular-nums;font-weight:800}
.pill .p{color:var(--ok)}.pill .m{color:var(--bad)}
.inline{display:grid;grid-template-columns:1fr auto;gap:10px}
.split{display:flex;flex-wrap:wrap;gap:8px}
.split label{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;min-height:42px;cursor:pointer;color:var(--ink)}
.split input{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.exp{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:none}
.exp .d{font-weight:700;overflow-wrap:anywhere}
.exp .meta{grid-column:1/2;font-size:13px;color:var(--muted)}
.exp .v{font-weight:800;font-variant-numeric:tabular-nums}
.gbar{display:grid;grid-template-columns:1fr auto;gap:10px}
.txwrap{display:grid;gap:6px}
.txbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.txbtns button{font:inherit;font-size:13px;font-weight:700;border-radius:10px;border:1.5px solid rgb(255 255 255 / .35);background:transparent;color:var(--hero-ink);padding:6px 10px;min-height:36px;cursor:pointer}
.txbtns button.full{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.partial{display:flex;gap:6px}.partial input{background:rgb(255 255 255 / .1);color:var(--hero-ink);border-color:rgb(255 255 255 / .3);min-height:40px}
.payrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.payrow:last-child{border-bottom:none}
</style>
</head>
<body>
<header class="top"><a href="../" data-i18n="back">← Apps Útiles</a><select class="lang"></select></header>
<section class="hero">
  <div class="hero-in">
    <div class="brand">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 2.2-5 5-5s5 2 5 5M14 15.5c.9-.4 1.9-.6 3-.6 2.3 0 4 1.7 4 4.6"/></svg></div>
      <h1>Cuentas Claras</h1>
    </div>
    <p class="tagline" data-i18n="tagline">Quién pagó qué y quién debe a quién.</p>
    <ol class="steps">
      <li><b>1</b><span data-i18n="s1">Añade a las personas</span></li>
      <li><b>2</b><span data-i18n="s2">Apunta cada gasto</span></li>
      <li><b>3</b><span data-i18n="s3">Mira quién paga a quién</span></li>
    </ol>
  </div>
</section>

<main class="wrap">
  <section id="example"></section>

  <section class="card">
    <div class="gbar"><select id="groupSel" data-i18n-aria="group"></select><button class="btn small ghost" id="newGroup" data-i18n="newGroup">+ Nuevo grupo</button></div>
    <div class="row"><button class="btn small ghost" id="rename" data-i18n="rename">Renombrar</button><button class="btn small ghost" id="exportBtn" data-i18n="copySum">Copiar resumen</button></div>
    <form class="inline" id="renameForm" hidden><input id="renameInput" data-i18n-aria="rename"><button class="btn small" data-i18n="save">Guardar</button></form>
    <div id="groupPro" aria-live="polite"></div>
  </section>

  <section class="card result" id="settleCard" aria-live="polite">
    <span class="lbl" data-i18n="settleH">Para quedar en paz</span>
    <div id="settle" style="display:grid;gap:8px"></div>
    <div class="stats" id="totals"></div>
  </section>

  <section class="card">
    <h2><span class="n">1</span><span data-i18n="peopleH">Personas</span></h2>
    <div class="people" id="people"></div>
    <form class="inline" id="personForm"><input id="personName" data-i18n-ph="name" data-i18n-aria="name"><button class="btn" data-i18n="add">Añadir</button></form>
  </section>

  <section class="card">
    <h2><span class="n">2</span><span data-i18n="newExp">Nuevo gasto</span></h2>
    <form id="expForm" style="display:grid;gap:12px">
      <label class="f"><span data-i18n="concept">Concepto</span><input id="expDesc" required data-i18n-ph="conceptPh"></label>
      <div class="grid2">
        <label class="f"><span data-i18n="amount">Importe (€)</span><input id="expAmt" type="number" step="0.01" min="0.01" inputmode="decimal" required></label>
        <label class="f"><span data-i18n="paid">Pagó</span><select id="expPayer"></select></label>
      </div>
      <div class="f"><span data-i18n="between">Entre quiénes se reparte</span><div class="split" id="expSplit"></div></div>
      <button class="btn" data-i18n="saveExp">Guardar gasto</button>
    </form>
  </section>

  <section class="card" id="expCard"><h2 data-i18n="expH">Gastos</h2><div id="expenses"></div></section>

  <section class="card" id="payCard">
    <h2><span class="n">3</span><span data-i18n="payH">Pagos entre vosotros</span></h2>
    <p class="help" data-i18n="payHelp"></p>
    <form id="payForm" style="display:grid;gap:10px">
      <div class="grid2"><label class="f"><span data-i18n="from">Quién paga</span><select id="payFrom"></select></label><label class="f"><span data-i18n="to">A quién</span><select id="payTo"></select></label></div>
      <div class="inline"><input id="payAmt" type="number" step="0.01" min="0.01" inputmode="decimal" required data-i18n-aria="amount" data-i18n-ph="amount"><button class="btn" data-i18n="savePay">Guardar pago</button></div>
      <div class="msg" id="payMsg" aria-live="polite"></div>
    </form>
    <div id="pays"></div>
  </section>

  <section id="exportBar"></section>

  <section class="card"><h2 data-i18n="usesH">¿Para qué te sirve?</h2><div class="uses" id="uses"></div></section>
  <section class="card" id="amz"></section>
</main>
<footer data-auto></footer>

function balances(){const b={};S.people.forEach(p=>b[p]=0);S.exp.forEach(e=>{const sh=e.a/e.s.length;if(b[e.p]!==undefined)b[e.p]+=e.a;e.s.forEach(p=>{if(b[p]!==undefined)b[p]-=sh})});(S.pay||[]).forEach(x=>{if(b[x.f]!==undefined)b[x.f]+=x.a;if(b[x.t]!==undefined)b[x.t]-=x.a});return b}
function addPay(f,to,a){if(!(a>0)||f===to)return;S.pay=S.pay||[];S.pay.push({f,t:to,a:Math.round(a*100)/100});save();render()}
function settle(b){const cr=[],db=[];Object.entries(b).forEach(([p,v])=>{v=Math.round(v*100)/100;if(v>.004)cr.push([p,v]);else if(v<-.004)db.push([p,-v])});
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const m=Math.min(db[i][1],cr[j][1]);out.push([db[i][0],cr[j][0],m]);db[i][1]-=m;cr[j][1]-=m;if(db[i][1]<.005)i++;if(cr[j][1]<.005)j++}return out}
function render(){
  const b=balances(),tr=settle(b),tot=S.exp.reduce((x,e)=>x+e.a,0);
  document.getElementById('settle').innerHTML=tr.length?tr.map(([f,to,m],k)=>`<div class="txwrap"><div class="tx"><span class="who">${esc(f)}</span><span class="arrow">${t('pays')} →<span class="amt">${fmtEUR(m)}</span></span><span class="who">${esc(to)}</span></div>
  <div class="txbtns no-export"><button class="full" data-k="${k}">${t('markPaid')}</button><button data-pk="${k}">${t('partial')}</button></div>
  <form class="partial no-export" data-k="${k}" hidden><input type="number" step="0.01" min="0.01" max="${m.toFixed(2)}" inputmode="decimal" aria-label="${t('amount')}" placeholder="${t('amount')}"><button class="btn small">OK</button></form></div>`).join(''):`<p class="ok">${t('allOk')}</p>`;
  document.querySelectorAll('#settle .full').forEach(b=>b.onclick=()=>{const x=tr[+b.dataset.k];addPay(x[0],x[1],x[2])});
  document.querySelectorAll('#settle [data-pk]').forEach(b=>b.onclick=()=>{const f=document.querySelector(`#settle form[data-k="${b.dataset.pk}"]`);f.hidden=!f.hidden;if(!f.hidden)f.querySelector('input').focus()});
  document.querySelectorAll('#settle form.partial').forEach(f=>f.onsubmit=e=>{e.preventDefault();const x=tr[+f.dataset.k],a=parseFloat(String(f.querySelector('input').value).replace(',','.'));addPay(x[0],x[1],Math.min(a,x[2]))});
  const paidTot=(S.pay||[]).reduce((s,x)=>s+x.a,0);
  document.getElementById('totals').innerHTML=`<div><span class="lbl">${t('total')}</span><b>${fmtEUR(tot)}</b></div><div><span class="lbl">${t('avg')}</span><b>${fmtEUR(S.people.length?tot/S.people.length:0)}</b></div><div><span class="lbl">${t('payments')}</span><b>${tr.length}</b></div><div><span class="lbl">${t('paidTot')}</span><b>${fmtEUR(paidTot)}</b></div>`;
  const opt=S.people.map(p=>`<option>${esc(p)}</option>`).join('');const pf=document.getElementById('payFrom'),pt=document.getElementById('payTo'),vf=pf.value,vt=pt.value;
  pf.innerHTML=opt;pt.innerHTML=opt;if(vf)pf.value=vf;if(vt)pt.value=vt;else if(S.people[1])pt.value=S.people[1];
  document.getElementById('pays').innerHTML=(S.pay||[]).length?S.pay.map((x,i)=>`<div class="payrow"><span>💸 ${t('payLine',{f:'<b>'+esc(x.f)+'</b>',a:'<b>'+fmtEUR(x.a)+'</b>',t:'<b>'+esc(x.t)+'</b>'})}</span><button class="x" data-i="${i}" aria-label="${t('remove')}">×</button></div>`).reverse().join(''):`<p class="muted">${t('noPay')}</p>`;
  document.querySelectorAll('#pays .x').forEach(x=>x.onclick=()=>{S.pay.splice(+x.dataset.i,1);save();render()});
  document.getElementById('people').innerHTML=S.people.length?S.people.map((p,i)=>{const v=b[p];return `<span class="pill">${esc(p)} <small class="${v>=0?'p':'m'}">${v>=0?'+':''}${fmtEUR(v)}</small><button class="x" data-i="${i}" aria-label="${t('remove')} ${esc(p)}">×</button></span>`}).join(''):`<span class="muted">${t('noPeople')}</span>`;
  document.querySelectorAll('#people .x').forEach(x=>x.onclick=()=>{const p=S.people[x.dataset.i];S.people.splice(x.dataset.i,1);S.exp=S.exp.filter(e=>e.p!==p).map(e=>Object.assign({},e,{s:e.s.filter(y=>y!==p)})).filter(e=>e.s.length);S.pay=(S.pay||[]).filter(x=>x.f!==p&&x.t!==p);save();render()});
  document.getElementById('expPayer').innerHTML=S.people.map(p=>`<option>${esc(p)}</option>`).join('');
  document.getElementById('expSplit').innerHTML=S.people.map((p,i)=>`<label><input type="checkbox" id="sp${i}" value="${esc(p)}" checked>${esc(p)}</label>`).join('');
  document.getElementById('expenses').innerHTML=S.exp.length?S.exp.map((e,i)=>`<div class="exp"><span class="d">${esc(e.d)}</span><span class="v">${fmtEUR(e.a)}</span><button class="x" data-i="${i}" aria-label="${t('remove')}">×</button><span class="meta">${t('meta',{p:esc(e.p),s:e.s.map(esc).join(', ')})}</span></div>`).reverse().join(''):`<p class="muted">${t('noExp')}</p>`;
  document.querySelectorAll('#expenses .x').forEach(x=>x.onclick=()=>{S.exp.splice(+x.dataset.i,1);save();render()});
  renderGroups();
}
function renderGroups(){document.getElementById('groupSel').innerHTML=G.groups.map((g,i)=>`<option value="${i}"${i===G.cur?' selected':''}${!window.PRO&&i>0?' disabled':''}>${esc(g.name)}${!window.PRO&&i>0?' '+t('locked'):''}</option>`).join('')}
function showPro(k){document.getElementById('groupPro').innerHTML=window.PRO?'':proBanner(t(k))}
document.getElementById('groupSel').onchange=e=>{G.cur=+e.target.value;S=G.groups[G.cur];save();render()};
document.getElementById('rename').onclick=()=>{const f=document.getElementById('renameForm');f.hidden=!f.hidden;document.getElementById('renameInput').value=S.name;if(!f.hidden)document.getElementById('renameInput').focus()};
document.getElementById('renameForm').onsubmit=e=>{e.preventDefault();const v=document.getElementById('renameInput').value.trim();if(v){S.name=v;save();renderGroups()}e.target.hidden=true};
document.getElementById('newGroup').onclick=()=>{if(!window.PRO){showPro('proGroups');return}G.groups.push({name:t('groupN',{n:G.groups.length+1}),people:[],exp:[]});G.cur=G.groups.length-1;S=G.groups[G.cur];save();render();document.getElementById('rename').click()};
document.getElementById('exportBtn').onclick=async e=>{const btn=e.currentTarget;if(!window.PRO){showPro('proCopy');return}
  const b=balances(),tr=settle(b),tot=S.exp.reduce((x,y)=>x+y.a,0);
  const txt=`💸 ${S.name}\n${t('total')}: ${fmtEUR(tot)}\n\n${t('sumTitle')}\n`+(tr.length?tr.map(([f,to,m])=>`• ${f} ${t('pays')} ${to}: ${fmtEUR(m)}`).join('\n'):t('allOk'))+((S.pay||[]).length?`\n\n${t('sumPays')}\n`+S.pay.map(x=>`• ${t('payLine',{f:x.f,a:fmtEUR(x.a),t:x.t})}`).join('\n'):'')+`\n\n${t('sumExp')}\n`+S.exp.map(x=>`• ${x.d}: ${fmtEUR(x.a)} (${t('sumBy')} ${x.p})`).join('\n')+`\n\nCuentas Claras · gonza0297.github.io/microapps/cuentas-claras/`;
  try{await navigator.clipboard.writeText(txt);btn.textContent=t('copied')}catch(err){btn.textContent=t('copyFail')}setTimeout(()=>btn.textContent=t('copySum'),2000)};
document.getElementById('payForm').onsubmit=e=>{e.preventDefault();const f=document.getElementById('payFrom').value,to=document.getElementById('payTo').value,a=parseFloat(String(document.getElementById('payAmt').value).replace(',','.'));const m=document.getElementById('payMsg');if(f===to){m.textContent=t('samePerson');return}m.textContent='';addPay(f,to,a);document.getElementById('payAmt').value=''};
document.getElementById('personForm').onsubmit=e=>{e.preventDefault();const n=document.getElementById('personName').value.trim();if(n&&!S.people.includes(n)){S.people.push(n);save();render()}document.getElementById('personName').value=''};
document.getElementById('expForm').onsubmit=e=>{e.preventDefault();const s=[...document.querySelectorAll('#expSplit input:checked')].map(x=>x.value);const a=parseFloat(String(document.getElementById('expAmt').value).replace(',','.'));
  if(!s.length||!(a>0))return;S.exp.push({d:document.getElementById('expDesc').value.trim()||t('expense'),a,p:document.getElementById('expPayer').value,s});save();document.getElementById('expDesc').value='';document.getElementById('expAmt').value='';render()};
document.getElementById('uses').innerHTML=USES.map(u=>`<div class="use"><b>${T(u[0])}</b><span>${T(u[1])}</span></div>`).join('');
renderAmazon('amz',D.amzH,AMZ);

exampleCard('example',D.exStory,()=>{const ex=example();S.name=ex.name;S.people=ex.people;S.exp=ex.exp;S.pay=[];save();render();document.getElementById('settleCard').scrollIntoView({behavior:'smooth'})},()=>{S.people=[];S.exp=[];S.pay=[];save();render()});
exportBar('exportBar',()=>[document.getElementById('settleCard'),document.getElementById('expCard'),document.getElementById('payCard')],'Cuentas-Claras');
render();
</script>
</body>
</html>
